name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYVISTA_OFF_SCREEN: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      # No VTK wheel SDK is fetched here, so the build carries cvista only.
      - run: uv sync --no-editable --extra cvista --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v3.0.1
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        backend: [vtk, cvista]
    env:
      PYVISTA_VTK_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
      - run: uv venv
      # --no-sync, not --no-project: the SDK is fetched per interpreter, so it
      # has to be the one .venv holds.
      - run: uv run --no-sync python scripts/fetch_vtk_sdk.py
      - run: uv sync --no-editable --extra cvista --extra vtk --group dev --group sdk
      - run: uv run --no-sync pytest --cov --cov-report=xml
      - if: matrix.python-version == '3.12' && matrix.backend == 'vtk'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            only: cp312-manylinux_x86_64
          - os: windows-latest
            only: cp312-win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          only: ${{ matrix.only }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.only }}
          path: wheelhouse/pyvista_render_passes-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-wheel-${{ matrix.only }}
          path: wheelhouse/pyvista_render_passes_sdk-*.whl

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv run --no-sync python scripts/fetch_vtk_sdk.py
      # An absolute VTK_DIR: CMake resolves a relative one against the build dir.
      - run: >-
          cmake -S extensions -B build/static -DPVRP_STATIC=ON -DPVRP_BACKEND=vtk
          -DVTK_DIR="$(uv run --no-sync python scripts/build_variants.py | awk -F'|' '$1 == "vtk" { print $2 }')"
          -DCMAKE_INSTALL_PREFIX="$PWD/build/static-prefix"
      - run: cmake --build build/static --parallel && cmake --install build/static
      - run: |
          test -f build/static-prefix/lib/libPyVistaRenderPasses.a
          test -f build/static-prefix/lib/cmake/PyVistaRenderPasses/PyVistaRenderPasses-targets.cmake
          test -f build/static-prefix/lib/cmake/PyVistaRenderPasses/PyVistaRenderPasses-vtk-module-properties.cmake

  wasm:
    runs-on: ubuntu-latest
    # A release tag: Kitware prunes its nightly images, and a pruned digest cannot be pulled.
    container: kitware/vtk-wasm-sdk@sha256:1fb94dab254612d20843a8e25d3506995f354873beb93b407007f725efb4841f # 9.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          emcmake cmake -S extensions -B build/wasm -DPVRP_STATIC=ON -DPVRP_BACKEND=vtk
          -DVTK_DIR=/VTK-install/Release/wasm32/lib/cmake/vtk
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/wasm-prefix"
      - run: cmake --build build/wasm --parallel
      - run: cmake --install build/wasm
      - run: |
          test -f build/wasm-prefix/lib/libPyVistaRenderPasses.a
          test -f build/wasm-prefix/lib/cmake/PyVistaRenderPasses/PyVistaRenderPasses-targets.cmake
          test -f build/wasm-prefix/lib/cmake/PyVistaRenderPasses/PyVistaRenderPasses-vtk-module-properties.cmake
